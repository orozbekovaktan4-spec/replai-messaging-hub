<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPLAI - Business Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <!-- Header -->
      <div class="login-header">
        <div class="login-logo">✂️</div>
        <h1 class="login-title">REPLAI</h1>
        <p class="login-subtitle">Manage your barber shop</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input
            type="email"
            id="email"
            class="input"
            placeholder="your@email.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            class="input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>

        <div id="errorMessage" class="error-message hidden"></div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          Sign In
        </button>
      </form>

      <!-- Footer -->
      <div class="login-footer">
        Need help? Contact us at <a href="https://t.me/replai_support" target="_blank">t.me/replai_support</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Redirect if already logged in
    if (BusinessAuth.isLoggedIn()) {
      window.location.href = '/business/dashboard.html';
    }

    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      const loginBtn = document.getElementById('loginBtn');

      // Clear previous error
      errorMessage.classList.add('hidden');
      errorMessage.textContent = '';

      // Validate inputs
      if (!email || !password) {
        errorMessage.textContent = 'Please enter both email and password';
        errorMessage.classList.remove('hidden');
        return;
      }

      if (!isValidEmail(email)) {
        errorMessage.textContent = 'Please enter a valid email address';
        errorMessage.classList.remove('hidden');
        return;
      }

      // Show loading state
      setLoading(loginBtn, true);

      try {
        // Call login API
        const response = await API.post('/api/business/auth/login', {
          email,
          password
        });

        if (response.success && response.token) {
          // Save auth data
          BusinessAuth.save(response.token, response.business);

          // Show success message
          showToast('Login successful! Welcome back 👋', 'success');

          // Redirect to dashboard
          setTimeout(() => {
            window.location.href = '/business/dashboard.html';
          }, 500);
        } else {
          errorMessage.textContent = response.error || 'Login failed';
          errorMessage.classList.remove('hidden');
          setLoading(loginBtn, false);
        }
      } catch (err) {
        console.error('Login error:', err);
        errorMessage.textContent = 'Invalid email or password';
        errorMessage.classList.remove('hidden');
        setLoading(loginBtn, false);
      }
    });

    // Allow Enter key to submit
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>

</body>
</html>
