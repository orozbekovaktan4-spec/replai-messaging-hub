<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - REPLAI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="page-header">
      <div class="page-title">💬 Messages</div>
    </div>

    <!-- Content -->
    <div class="page-content">

      <!-- Platform Filter Tabs -->
      <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border);">
        <button class="btn btn-sm platform-filter active" data-platform="all" onclick="filterPlatform('all')">
          All
        </button>
        <button class="btn btn-sm btn-ghost platform-filter" data-platform="instagram" onclick="filterPlatform('instagram')">
          📷 Instagram
        </button>
        <button class="btn btn-sm btn-ghost platform-filter" data-platform="telegram" onclick="filterPlatform('telegram')">
          ✈️ Telegram
        </button>
        <button class="btn btn-sm btn-ghost platform-filter" data-platform="whatsapp" onclick="filterPlatform('whatsapp')">
          💬 WhatsApp
        </button>
      </div>

      <!-- Messages List -->
      <div id="messagesList">
        <div class="text-center text-muted" style="padding: 20px;">
          Loading messages...
        </div>
      </div>

    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item">
        <span class="icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="bookings.html" class="nav-item">
        <span class="icon">📅</span>
        <span>Bookings</span>
      </a>
      <a href="messages.html" class="nav-item active">
        <span class="icon">💬</span>
        <span>Messages</span>
      </a>
      <a href="settings.html" class="nav-item">
        <span class="icon">⚙️</span>
        <span>Settings</span>
      </a>
    </nav>
  </div>

  <script src="app.js"></script>
  <script>
    let messagesData = [];
    let currentPlatform = 'all';

    // Initialize page
    async function init() {
      const authenticated = await requireAuth();
      if (!authenticated) return;

      setActiveNav('messages');
      await loadMessages();
    }

    // Load messages
    async function loadMessages() {
      try {
        const data = await API.get(`/api/business/messages?platform=${currentPlatform}&limit=100`);
        messagesData = data.messages || [];
        renderMessages();
      } catch (err) {
        handleError(err, 'Failed to load messages');
      }
    }

    // Filter by platform
    async function filterPlatform(platform) {
      currentPlatform = platform;

      // Update active button
      document.querySelectorAll('.platform-filter').forEach(btn => {
        if (btn.dataset.platform === platform) {
          btn.classList.remove('btn-ghost');
          btn.classList.add('active');
        } else {
          btn.classList.add('btn-ghost');
          btn.classList.remove('active');
        }
      });

      await loadMessages();
    }

    // Render messages list
    function renderMessages() {
      const container = document.getElementById('messagesList');

      if (messagesData.length === 0) {
        container.innerHTML = `
          <div class="card">
            <div class="empty-state">
              <div class="empty-icon">💬</div>
              <div class="empty-title">No messages</div>
              <div class="empty-text">
                ${currentPlatform === 'all' ?
                  'No customer messages yet' :
                  `No messages from ${currentPlatform}`
                }
              </div>
            </div>
          </div>
        `;
        return;
      }

      // Group messages by user
      const grouped = groupMessagesByUser(messagesData);

      const html = grouped.map(conversation => {
        const emoji = getPlatformEmoji(conversation.platform);
        const lastMessage = conversation.messages[0];
        const messageCount = conversation.messages.length;

        return `
          <div class="message-item" onclick="toggleConversation('${conversation.userId}')">
            <div class="message-platform">${emoji}</div>
            <div class="message-content">
              <div class="message-header">
                <div class="message-user">${conversation.userName}</div>
                <div class="message-time">${formatTimestamp(lastMessage.timestamp)}</div>
              </div>
              <div class="message-preview">${lastMessage.userMessage}</div>
              <div style="font-size: 11px; color: var(--text-lighter); margin-top: 4px;">
                ${messageCount} message${messageCount > 1 ? 's' : ''}
              </div>
            </div>
          </div>

          <!-- Conversation thread (hidden by default) -->
          <div id="conv_${conversation.userId}" class="hidden" style="margin-bottom: 16px;">
            <div class="card" style="background: var(--bg);">
              ${conversation.messages.map(msg => `
                <div style="margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border);">
                  <!-- User message -->
                  <div style="background: white; padding: 12px; border-radius: var(--radius); margin-bottom: 8px;">
                    <div style="font-size: 11px; color: var(--text-lighter); margin-bottom: 4px;">
                      ${msg.userName || 'Customer'} • ${formatTimestamp(msg.timestamp)}
                    </div>
                    <div style="font-size: 14px; color: var(--text);">
                      ${msg.userMessage}
                    </div>
                  </div>

                  <!-- AI response -->
                  <div style="background: #e8f5e9; padding: 12px; border-radius: var(--radius);">
                    <div style="font-size: 11px; color: var(--text-lighter); margin-bottom: 4px;">
                      🤖 AI Response
                    </div>
                    <div style="font-size: 14px; color: var(--text);">
                      ${msg.aiResponse}
                    </div>
                  </div>
                </div>
              `).reverse().join('')}
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = html;
    }

    // Group messages by user
    function groupMessagesByUser(messages) {
      const userMap = new Map();

      messages.forEach(msg => {
        const key = `${msg.platform}_${msg.userId}`;

        if (!userMap.has(key)) {
          userMap.set(key, {
            userId: key,
            userName: msg.userName || `Customer ${msg.userId.substring(0, 6)}`,
            platform: msg.platform,
            messages: []
          });
        }

        userMap.get(key).messages.push(msg);
      });

      // Sort by most recent message
      return Array.from(userMap.values()).sort((a, b) => {
        const timeA = new Date(a.messages[0].timestamp).getTime();
        const timeB = new Date(b.messages[0].timestamp).getTime();
        return timeB - timeA;
      });
    }

    // Toggle conversation thread visibility
    function toggleConversation(userId) {
      const conv = document.getElementById(`conv_${userId}`);
      if (conv) {
        if (conv.classList.contains('hidden')) {
          // Hide all other conversations first
          document.querySelectorAll('[id^="conv_"]').forEach(c => {
            c.classList.add('hidden');
          });
          // Show this one
          conv.classList.remove('hidden');
        } else {
          conv.classList.add('hidden');
        }
      }
    }

    // Make functions global
    window.filterPlatform = filterPlatform;
    window.toggleConversation = toggleConversation;

    // Initialize
    init();
  </script>

</body>
</html>
