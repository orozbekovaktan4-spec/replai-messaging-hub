<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - REPLAI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="page-header">
      <div class="page-title">⚙️ Settings</div>
    </div>

    <!-- Content -->
    <div class="page-content">

      <!-- Business Profile Section -->
      <div class="section">
        <div class="section-header">
          <div class="section-title">🏪 Business Profile</div>
        </div>

        <div class="card">
          <form id="profileForm">
            <div class="form-group">
              <label class="form-label">Business Name</label>
              <input type="text" id="businessName" class="input" placeholder="Your business name">
            </div>

            <div class="form-group">
              <label class="form-label">Owner Name</label>
              <input type="text" id="ownerName" class="input" placeholder="Your name" readonly>
              <div style="font-size: 12px; color: var(--text-lighter); margin-top: 4px;">
                Contact admin to change owner name
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Phone Number</label>
              <input type="tel" id="phone" class="input" placeholder="+996555123456">
            </div>

            <div class="form-group">
              <label class="form-label">Address</label>
              <input type="text" id="address" class="input" placeholder="Shop location">
            </div>

            <div class="form-group">
              <label class="form-label">Instagram Handle</label>
              <div style="display: flex; gap: 8px;">
                <span style="padding: 14px 12px; background: var(--bg); border-radius: var(--radius); color: var(--text-light);">@</span>
                <input type="text" id="instagram" class="input" placeholder="yourbarbershop" style="flex: 1;">
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- AI Settings Section -->
      <div class="section">
        <div class="section-header">
          <div class="section-title">🤖 AI Assistant</div>
        </div>

        <div class="card">
          <div class="form-group">
            <label class="form-label">AI Response Language</label>
            <select id="aiLanguage" class="input">
              <option value="auto">Auto-detect</option>
              <option value="russian">Russian</option>
              <option value="kyrgyz">Kyrgyz</option>
              <option value="english">English</option>
            </select>
            <div style="font-size: 12px; color: var(--text-lighter); margin-top: 4px;">
              AI will respond to customers in this language
            </div>
          </div>
        </div>
      </div>

      <!-- Save Button -->
      <div style="margin-bottom: 24px;">
        <button class="btn btn-primary" id="saveBtn" onclick="saveSettings()">
          Save Changes
        </button>
      </div>

      <!-- Divider -->
      <div style="height: 1px; background: var(--border); margin: 32px 0;"></div>

      <!-- Account Section -->
      <div class="section">
        <div class="section-header">
          <div class="section-title">👤 Account</div>
        </div>

        <div class="card">
          <div style="margin-bottom: 16px;">
            <div style="font-size: 13px; color: var(--text-light); margin-bottom: 4px;">
              Logged in as
            </div>
            <div style="font-weight: 600; font-size: 15px;" id="userEmail">
              Loading...
            </div>
          </div>

          <button class="btn btn-danger" style="width: 100%;" onclick="handleLogout()">
            Logout
          </button>
        </div>
      </div>

      <!-- Footer Info -->
      <div style="text-align: center; padding: 24px 0; color: var(--text-lighter); font-size: 12px;">
        <div>REPLAI Business Dashboard</div>
        <div style="margin-top: 4px;">Version 1.0.0</div>
        <div style="margin-top: 8px;">
          <a href="https://t.me/replai_support" target="_blank" style="color: var(--accent); text-decoration: none;">
            Need help? Contact support
          </a>
        </div>
      </div>

    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item">
        <span class="icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="bookings.html" class="nav-item">
        <span class="icon">📅</span>
        <span>Bookings</span>
      </a>
      <a href="messages.html" class="nav-item">
        <span class="icon">💬</span>
        <span>Messages</span>
      </a>
      <a href="settings.html" class="nav-item active">
        <span class="icon">⚙️</span>
        <span>Settings</span>
      </a>
    </nav>
  </div>

  <script src="app.js"></script>
  <script>
    let settingsData = null;

    // Initialize page
    async function init() {
      const authenticated = await requireAuth();
      if (!authenticated) return;

      setActiveNav('settings');
      await loadSettings();
      displayUserInfo();
    }

    // Display user info
    function displayUserInfo() {
      const business = BusinessAuth.getBusiness();
      document.getElementById('userEmail').textContent = business.email || 'N/A';
    }

    // Load settings
    async function loadSettings() {
      try {
        const data = await API.get('/api/business/settings');
        settingsData = data;

        // Populate form
        document.getElementById('businessName').value = data.business.name || '';
        document.getElementById('ownerName').value = data.business.ownerName || '';
        document.getElementById('phone').value = data.business.phone || '';
        document.getElementById('address').value = data.business.address || '';

        const instagram = data.business.instagram || '';
        document.getElementById('instagram').value = instagram.replace('@', '');

        document.getElementById('aiLanguage').value = data.aiSettings.language || 'auto';

      } catch (err) {
        handleError(err, 'Failed to load settings');
      }
    }

    // Save settings
    async function saveSettings() {
      const saveBtn = document.getElementById('saveBtn');
      setLoading(saveBtn, true);

      const name = document.getElementById('businessName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();
      const instagram = document.getElementById('instagram').value.trim();
      const aiLanguage = document.getElementById('aiLanguage').value;

      try {
        const result = await API.post('/api/business/settings', {
          name,
          phone,
          address,
          instagram: instagram ? `@${instagram.replace('@', '')}` : '',
          aiLanguage
        });

        if (result.success) {
          showToast('Settings saved successfully! ✅', 'success');

          // Update stored business data
          const business = BusinessAuth.getBusiness();
          business.name = name || business.name;
          business.phone = phone || business.phone;
          business.address = address || business.address;
          BusinessAuth.save(BusinessAuth.getToken(), business);

        } else {
          showToast(result.error || 'Failed to save settings', 'error');
        }
      } catch (err) {
        handleError(err, 'Failed to save settings');
      } finally {
        setLoading(saveBtn, false);
      }
    }

    // Handle logout
    function handleLogout() {
      confirmDialog(
        'Are you sure you want to logout?',
        async () => {
          showLoading();
          await BusinessAuth.logout();
          hideLoading();
        }
      );
    }

    // Make functions global
    window.saveSettings = saveSettings;
    window.handleLogout = handleLogout;

    // Initialize
    init();
  </script>

</body>
</html>
