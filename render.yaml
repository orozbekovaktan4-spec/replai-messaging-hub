services:
  - type: web
    name: replai
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres_db
          property: connectionString

databases:
  - name: postgres_db
    databaseName: replai_db
    plan: free
