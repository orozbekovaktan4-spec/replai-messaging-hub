<!DOCTYPE html>
<html>
<head>
    <title>Test Google OAuth</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #357ae8;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
        .success {
            color: #388e3c;
            background: #e8f5e9;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Google Sign-In</h1>
    
    <div style="margin-bottom: 20px;">
        <h3>Step 1: Check Configuration</h3>
        <button onclick="checkConfig()">Check Config</button>
        <div id="config-result"></div>
    </div>
    
    <div style="margin-bottom: 20px;">
        <h3>Step 2: Test Sign-In</h3>
        <button onclick="testGoogleOAuth()">Sign in with Google</button>
        <div id="signin-result"></div>
    </div>
    
    <script>
        async function checkConfig() {
            const resultDiv = document.getElementById('config-result');
            resultDiv.innerHTML = '<p>Checking configuration...</p>';
            
            try {
                const response = await fetch('/api/auth/google/config');
                const config = await response.json();
                
                let html = '<div class="success"><h4>✅ Configuration Loaded:</h4>';
                html += '<pre>' + JSON.stringify(config, null, 2) + '</pre>';
                
                if (config.configured) {
                    html += '<p>✅ Google OAuth is configured!</p>';
                    html += '<p><strong>Redirect URI:</strong> ' + config.redirectUri + '</p>';
                    html += '<p><strong>Client ID:</strong> ' + config.clientId.substring(0, 20) + '...</p>';
                } else {
                    html += '<p class="error">❌ Google OAuth is NOT configured!</p>';
                }
                html += '</div>';
                
                resultDiv.innerHTML = html;
                
            } catch (error) {
                resultDiv.innerHTML = '<div class="error">❌ Error: ' + error.message + '</div>';
            }
        }
        
        async function testGoogleOAuth() {
            const resultDiv = document.getElementById('signin-result');
            resultDiv.innerHTML = '<div class="success">✅ Redirecting to Google OAuth...</div>';
            
            // Redirect after 1 second
            setTimeout(() => {
                window.location.href = '/api/auth/google';
            }, 1000);
        }
        
        // Auto-check config on page load
        window.addEventListener('load', checkConfig);
    </script>
</body>
</html>
